name: Bug report
description: Something in baton did the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. node scripts/dispatch-triage.mjs "..."
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Paste the full output. Remove any secrets first.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15 / Node 22 / launcher: files"
    validations:
      required: true
