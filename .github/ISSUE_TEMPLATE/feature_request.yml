name: Feature request
description: A launcher, adapter, gate or workflow baton should support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation with your agents where baton falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like baton to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
